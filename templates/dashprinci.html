<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミク · Tablero de Notas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:     #39c5bb;
      --teal-dark:#1ba8a0;
      --bg:       #0d0d1a;
      --bg2:      #0a1628;
      --card:     rgba(8,20,40,0.92);
      --text:     #e0f8f7;
      --dim:      rgba(57,197,187,0.55);
      --nav-h:    58px;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(8,20,40,0.97);
      border-bottom: 1.5px solid rgba(57,197,187,0.25);
      display: flex; align-items: center;
      padding: 0 28px; gap: 10px;
      z-index: 100;
      backdrop-filter: blur(10px);
      animation: fadeDown 0.4s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1rem; font-weight: 800;
      color: var(--teal);
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(57,197,187,0.5);
      flex: 1;
    }
    .nav-brand span.icon { font-size: 22px; }

    .nav-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(57,197,187,0.08);
      border: 1px solid rgba(57,197,187,0.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 0.78rem; letter-spacing: 1px;
      color: var(--dim); margin-right: 8px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      cursor: pointer; border: 1.5px solid rgba(57,197,187,0.25);
      background: rgba(57,197,187,0.07);
      color: var(--dim);
      letter-spacing: 1px;
      transition: all 0.25s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(57,197,187,0.15);
      border-color: rgba(57,197,187,0.55);
      color: var(--teal);
      box-shadow: 0 0 14px rgba(57,197,187,0.15);
    }
    .btn:active { transform: scale(0.97); }

    .btn-logout {
      background: rgba(231,76,60,0.08);
      border-color: rgba(231,76,60,0.25);
      color: rgba(231,76,60,0.7);
    }
    .btn-logout:hover {
      background: rgba(231,76,60,0.15);
      border-color: rgba(231,76,60,0.5);
      color: #e74c3c;
      box-shadow: 0 0 14px rgba(231,76,60,0.15);
    }

    .frame-wrap {
      margin-top: var(--nav-h);
      flex: 1;
      overflow: visible;
    }

    iframe {
      width: 100%;
      height: calc(100vh - var(--nav-h));
      min-height: 900px;
      border: none;
      display: block;
      overflow: hidden;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: scroll; /* solo una barra, la del navegador */
    }

    .star {
      position: fixed; border-radius: 50%;
      background: var(--teal); opacity: 0;
      animation: twinkle var(--d) ease-in-out infinite var(--delay);
      z-index: 0; pointer-events: none;
    }
    @keyframes twinkle {
      0%,100%{opacity:0;transform:scale(.5)}
      50%{opacity:var(--op);transform:scale(1)}
    }

    /* rock easter egg */
    #rockOverlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #rockOverlay.show { opacity: 1; pointer-events: all; }
    #rockImg {
      width: clamp(200px, 28vw, 350px); height: auto;
      border-radius: 16px; border: 3px solid #39c5bb;
      box-shadow: 0 0 50px rgba(57,197,187,0.6);
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <span class="icon">🎤</span>
    ミク · NOTAS
  </div>

  <a class="btn" href="/carga_masiva">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Carga masiva
  </a>

  <a class="btn" href="/editar_estudiante">
    ✏️ Editar estudiantes
  </a>

  <a class="btn" href="/top_estudiantes">
    🏆 Top estudiantes
  </a>

  <span class="nav-badge">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    {{ usuario }}
  </span>

  <a class="btn btn-logout" href="/logout">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Cerrar sesión
  </a>

  <a href="https://www.linkedin.com/jobs/" target="_blank"
     style="display:inline-flex;align-items:center;padding:2px 6px;border-radius:8px;border:1.5px solid rgba(57,197,187,0.2);background:rgba(57,197,187,0.05);transition:all 0.25s;text-decoration:none;"
     title="Busca trabajo 👀"
     onmouseover="this.style.borderColor='rgba(57,197,187,0.5)';this.style.background='rgba(57,197,187,0.12)'"
     onmouseout="this.style.borderColor='rgba(57,197,187,0.2)';this.style.background='rgba(57,197,187,0.05)'">
    <img src="/static/bruv-dancing.gif" style="height:42px;width:auto;image-rendering:pixelated;display:block;">
  </a>
</nav>

<div class="frame-wrap">
  <iframe src="/dashprincipal/"></iframe>
</div>

<script>
  for(let i=0;i<30;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;--d:${3+Math.random()*4}s;--delay:-${Math.random()*4}s;--op:${.2+Math.random()*.4};`;
    document.body.appendChild(s);
  }
</script>

<!-- pato.js crea el pato, honk, huevos y post-its -->
<script src="/static/pato.js"></script>

<!-- rock easter egg -->
<div id="rockOverlay">
  <img id="rockImg" src="/static/rock.jpg" alt="The Rock">
</div>
<audio id="vineAudio" src="/static/Vine boom sound effect.mp3" preload="auto"></audio>

<script>
(function() {
  var rockTimer = null;
  var iframe    = document.querySelector('iframe');

  function onKey(e) {
    if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if (e.key === 'r' || e.key === 'R') showRock();
  }

  window.addEventListener('keydown', onKey);

  function attachIframeListener() {
    try {
      var iWin = iframe.contentWindow;
      iWin.removeEventListener('keydown', onKey);
      iWin.addEventListener('keydown', onKey);
    } catch(err) {}
  }

  iframe.addEventListener('load', attachIframeListener);
  setInterval(attachIframeListener, 1500);

  function showRock() {
    var overlay = document.getElementById('rockOverlay');
    var audio   = document.getElementById('vineAudio');
    clearTimeout(rockTimer);
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    overlay.classList.add('show');
    audio.currentTime = 0;
    audio.play().catch(function(){});
    rockTimer = setTimeout(function() {
      overlay.classList.remove('show');
    }, 3000);
  }
})();
</script>
</body>
</html>
