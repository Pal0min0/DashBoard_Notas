<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミク · Editar Estudiante ✏️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:     #39c5bb;
      --teal-dark:#1ba8a0;
      --bg:       #0d0d1a;
      --bg2:      #0a1628;
      --card:     rgba(8,20,40,0.85);
      --text:     #e0f8f7;
      --dim:      rgba(57,197,187,0.55);
      --green:    #2ecc71;
      --green-s:  rgba(46,204,113,0.12);
      --red:      #e74c3c;
      --red-s:    rgba(231,76,60,0.12);
      --blue:     #3498db;
      --blue-s:   rgba(52,152,219,0.12);
      --nav-h:    58px;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
      color: var(--text); min-height: 100vh;
    }

    .star {
      position: fixed; border-radius: 50%; background: var(--teal); opacity: 0;
      animation: twinkle var(--d) ease-in-out infinite var(--delay); z-index: 0; pointer-events: none;
    }
    @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.5)} 50%{opacity:var(--op);transform:scale(1)} }

    nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: rgba(8,20,40,0.97);
      border-bottom: 1.5px solid rgba(57,197,187,0.25);
      display: flex; align-items: center; padding: 0 28px; z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.95rem; font-weight: 800;
      color: var(--teal); letter-spacing: 2px; flex: 1;
    }

    .btn-nav {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      cursor: pointer; border: 1.5px solid rgba(57,197,187,0.25);
      background: rgba(57,197,187,0.07); color: var(--dim);
      letter-spacing: 1px; transition: all 0.25s; text-decoration: none;
    }
    .btn-nav:hover {
      background: rgba(57,197,187,0.15); border-color: rgba(57,197,187,0.55);
      color: var(--teal);
    }

    main {
      padding-top: calc(var(--nav-h) + 40px);
      padding-bottom: 60px; max-width: 860px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
      position: relative; z-index: 1;
    }

    h1 { font-size: 1.6rem; font-weight: 800; color: var(--teal); letter-spacing: 3px; text-shadow: 0 0 20px rgba(57,197,187,0.4); margin-bottom: 6px; }
    .subtitle { color: var(--dim); font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 32px; }

    .card {
      background: var(--card);
      border: 1.5px solid rgba(57,197,187,0.2);
      border-radius: 16px; padding: 28px; margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 40px rgba(57,197,187,0.04);
    }

    .card-title {
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 3px; color: var(--dim); margin-bottom: 16px;
    }

    /* ── BÚSQUEDA ── */
    .search-row { display: flex; gap: 10px; align-items: center; }

    .search-input {
      flex: 1; padding: 11px 14px;
      border: 1.5px solid rgba(57,197,187,0.2);
      border-radius: 10px; font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.9rem; background: rgba(57,197,187,0.05);
      color: var(--text); transition: all 0.3s; outline: none;
    }
    .search-input::placeholder { color: rgba(57,197,187,0.25); }
    .search-input:focus {
      border-color: rgba(57,197,187,0.6);
      background: rgba(57,197,187,0.09);
      box-shadow: 0 0 14px rgba(57,197,187,0.15);
    }

    .btn-search {
      padding: 11px 22px;
      background: linear-gradient(90deg, var(--teal-dark), var(--teal));
      color: #0a1628; border: none; border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.88rem; font-weight: 800; cursor: pointer;
      letter-spacing: 1px; transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(57,197,187,0.3);
    }
    .btn-search:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(57,197,187,0.45); }

    /* ── TABLA ── */
    .results-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; margin-top: 16px; }
    .results-table th {
      text-align: left; padding: 10px 14px;
      background: rgba(57,197,187,0.08);
      border: 1px solid rgba(57,197,187,0.15);
      font-weight: 800; color: var(--dim);
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px;
    }
    .results-table td { padding: 10px 14px; border: 1px solid rgba(57,197,187,0.1); color: var(--text); }
    .results-table tr:nth-child(even) td { background: rgba(57,197,187,0.03); }
    .results-table tr.clickable { cursor: pointer; transition: background 0.15s; }
    .results-table tr.clickable:hover td { background: rgba(57,197,187,0.07); }

    .btn-select {
      padding: 5px 12px; border-radius: 8px;
      border: 1.5px solid rgba(52,152,219,0.4);
      background: var(--blue-s); color: var(--blue);
      font-size: 0.75rem; font-weight: 800; cursor: pointer;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      letter-spacing: 1px; transition: all 0.2s;
    }
    .btn-select:hover { background: rgba(52,152,219,0.22); }

    .no-results { text-align: center; color: var(--dim); padding: 30px; font-size: 0.88rem; letter-spacing: 1px; }

    /* ── FORMULARIO EDICIÓN ── */
    #editSection { display: none; }
    #editSection.visible { display: block; }

    .estudiante-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .estudiante-nombre { font-size: 1.1rem; font-weight: 800; color: var(--teal); }
    .estudiante-badge {
      background: rgba(57,197,187,0.08); border: 1px solid rgba(57,197,187,0.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 0.78rem; color: var(--dim); letter-spacing: 1px;
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 20px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 0.72rem; font-weight: 800; color: var(--dim);
      text-transform: uppercase; letter-spacing: 2px;
    }
    .form-group input, .form-group select {
      padding: 10px 12px; border: 1.5px solid rgba(57,197,187,0.2);
      border-radius: 10px; font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.9rem; background: rgba(57,197,187,0.05);
      color: var(--text); outline: none; transition: all 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: rgba(57,197,187,0.6);
      background: rgba(57,197,187,0.09);
      box-shadow: 0 0 12px rgba(57,197,187,0.15);
    }
    .form-group select option { background: #0d1a30; color: var(--text); }

    .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn-save {
      padding: 11px 26px;
      background: linear-gradient(90deg, var(--teal-dark), var(--teal));
      color: #0a1628; border: none; border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
      letter-spacing: 1px; transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(57,197,187,0.3);
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(57,197,187,0.45); }

    .btn-delete {
      padding: 11px 26px; background: var(--red-s); color: var(--red);
      border: 1.5px solid rgba(231,76,60,0.35); border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 0.9rem;
      font-weight: 800; cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
    }
    .btn-delete:hover { background: rgba(231,76,60,0.2); }

    .btn-report {
      padding: 11px 26px; background: rgba(57,197,187,0.08);
      color: var(--teal); border: 1.5px solid rgba(57,197,187,0.35);
      border-radius: 10px; font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
      letter-spacing: 1px; transition: all 0.2s;
    }
    .btn-report:hover { background: rgba(57,197,187,0.18); box-shadow: 0 0 14px rgba(57,197,187,0.2); }

    .btn-cancel {
      padding: 11px 20px; background: rgba(57,197,187,0.05);
      color: var(--dim); border: 1.5px solid rgba(57,197,187,0.2);
      border-radius: 10px; font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel:hover { background: rgba(57,197,187,0.1); color: var(--teal); }

    /* ── MENSAJES ── */
    .msg {
      padding: 12px 16px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700;
      margin-top: 16px; display: none; letter-spacing: 1px;
    }
    .msg.success { background: var(--green-s); border: 1.5px solid rgba(46,204,113,0.35); color: var(--green); display: block; }
    .msg.error   { background: var(--red-s);   border: 1.5px solid rgba(231,76,60,0.35);  color: var(--red); display: block; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.visible { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--card);
      border: 1.5px solid rgba(57,197,187,0.35);
      border-radius: 18px; padding: 36px;
      max-width: 400px; width: 90%;
      box-shadow: 0 0 60px rgba(57,197,187,0.15), 0 20px 60px rgba(0,0,0,0.6);
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes modalIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }

    .modal h3 { font-size: 1.1rem; font-weight: 800; color: var(--red); margin-bottom: 12px; letter-spacing: 1px; }
    .modal p { color: var(--dim); font-size: 0.88rem; line-height: 1.6; margin-bottom: 24px; }
    .modal p strong { color: var(--text); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    
    /* ── ROCK EASTER EGG ── */
    #rockOverlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #rockOverlay.show {
      opacity: 1;
    }
    #rockImg {
      width: clamp(200px, 28vw, 350px);
      height: auto;
      border-radius: 16px;
      border: 3px solid #39c5bb;
      box-shadow: 0 0 50px rgba(57,197,187,0.6);
      display: block;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">✏️ ミク · EDITAR ESTUDIANTES</div>
  <a class="btn-nav" href="/dashprincipal">← Volver al tablero</a>
</nav>

<main>
  <h1>✏️ Editar / Eliminar</h1>
  <p class="subtitle">Busca un estudiante por nombre para editar o eliminar sus datos ✨</p>

  <!-- BÚSQUEDA -->
  <div class="card">
    <div class="card-title">🔍 Buscar estudiante</div>
    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="Buscar por nombre..." type="text">
      <button class="btn-search" onclick="buscar()">🔍 Buscar</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- EDICIÓN -->
  <div class="card" id="editSection">
    <div class="card-title">✏️ Editar datos del estudiante</div>
    <div class="estudiante-header">
      <div class="estudiante-nombre" id="editNombreHeader"></div>
      <div class="estudiante-badge" id="editIdBadge"></div>
    </div>

    <input type="hidden" id="editId">

    <div class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="editNombre" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label>Edad</label>
        <input type="number" id="editEdad" min="15" max="80" placeholder="18 – 80">
      </div>
      <div class="form-group">
        <label>Carrera</label>
        <input type="text" id="editCarrera" placeholder="Ej. Ingeniería">
      </div>
      <div class="form-group">
        <label>Nota 1</label>
        <input type="number" id="editNota1" min="0" max="5" step="0.1" placeholder="0.0 – 5.0">
      </div>
      <div class="form-group">
        <label>Nota 2</label>
        <input type="number" id="editNota2" min="0" max="5" step="0.1" placeholder="0.0 – 5.0">
      </div>
      <div class="form-group">
        <label>Nota 3</label>
        <input type="number" id="editNota3" min="0" max="5" step="0.1" placeholder="0.0 – 5.0">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-save"   onclick="guardarCambios()">💾 Guardar cambios</button>
      <button class="btn-report" onclick="descargarReporte()">📄 Descargar reporte</button>
      <button class="btn-delete" onclick="confirmarEliminar()">🗑 Eliminar estudiante</button>
      <button class="btn-cancel" onclick="cancelarEdicion()">Cancelar</button>
    </div>

    <div class="msg" id="editMsg"></div>
  </div>
</main>

<!-- MODAL CONFIRMAR ELIMINAR -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3>⚠️ ¿Eliminar estudiante?</h3>
    <p>Esta acción no se puede deshacer. El estudiante <strong id="modalNombre"></strong> será eliminado permanentemente.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-delete" onclick="eliminarEstudiante()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script>
  for(let i=0;i<40;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;--d:${2+Math.random()*4}s;--delay:-${Math.random()*4}s;--op:${.2+Math.random()*.5};`;
    document.body.appendChild(s);
  }

  let estudianteSeleccionado = null;

  async function buscar() {
    const q = document.getElementById('searchInput').value.trim();
    const res  = await fetch(`/api/estudiantes/buscar?nombre=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderTabla(data.estudiantes);
  }

  async function cargarTodos() {
    const res  = await fetch('/api/estudiantes/buscar?nombre=');
    const data = await res.json();
    renderTabla(data.estudiantes);
  }

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscar();
  });

  function renderTabla(estudiantes) {
    const container = document.getElementById('searchResults');
    if (!estudiantes || estudiantes.length === 0) {
      container.innerHTML = '<div class="no-results">No se encontraron estudiantes.</div>';
      return;
    }
    let html = `<table class="results-table">
      <thead><tr>
        <th>ID</th><th>Nombre</th><th>Edad</th>
        <th>Carrera</th><th>Nota 1</th><th>Nota 2</th><th>Nota 3</th><th></th>
      </tr></thead><tbody>`;
    estudiantes.forEach(e => {
      const eJson = JSON.stringify(e).replace(/"/g, '&quot;');
      html += `<tr class="clickable" onclick="seleccionar(${eJson})">
        <td style="color:var(--dim)">${e.id}</td>
        <td><strong>${e.nombre}</strong></td>
        <td>${e.edad}</td>
        <td>${e.carrera}</td>
        <td>${e.nota1}</td><td>${e.nota2}</td><td>${e.nota3}</td>
        <td><button class="btn-select" onclick="event.stopPropagation();seleccionar(${eJson})">Seleccionar</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function seleccionar(est) {
    estudianteSeleccionado = est;
    document.getElementById('editId').value           = est.id;
    document.getElementById('editNombre').value       = est.nombre;
    document.getElementById('editEdad').value         = est.edad;
    document.getElementById('editCarrera').value      = est.carrera;
    document.getElementById('editNota1').value        = est.nota1;
    document.getElementById('editNota2').value        = est.nota2;
    document.getElementById('editNota3').value        = est.nota3;
    document.getElementById('editNombreHeader').textContent = est.nombre;
    document.getElementById('editIdBadge').textContent     = `ID: ${est.id}`;
    document.getElementById('editSection').classList.add('visible');
    document.getElementById('editMsg').className = 'msg';
    document.getElementById('editMsg').textContent = '';
    document.getElementById('editSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function descargarReporte() {
    if (!estudianteSeleccionado) return;
    const id = estudianteSeleccionado.id;
    // abre en nueva pestaña → el navegador descarga el PDF
    window.open(`/api/estudiantes/reporte/${id}`, '_blank');
  }

  function cancelarEdicion() {
    estudianteSeleccionado = null;
    document.getElementById('editSection').classList.remove('visible');
  }

  async function guardarCambios() {
    const id     = document.getElementById('editId').value;
    const nombre = document.getElementById('editNombre').value.trim();
    const edad   = document.getElementById('editEdad').value;
    const carrera= document.getElementById('editCarrera').value.trim();
    const nota1  = document.getElementById('editNota1').value;
    const nota2  = document.getElementById('editNota2').value;
    const nota3  = document.getElementById('editNota3').value;

    if (!nombre || !edad || !carrera || !nota1 || !nota2 || !nota3) {
      mostrarMsg('⚠️ Por favor completa todos los campos.', 'error'); return;
    }

    const res  = await fetch('/api/estudiantes/editar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, nombre, edad: parseInt(edad),
                             carrera, nota1: parseFloat(nota1),
                             nota2: parseFloat(nota2), nota3: parseFloat(nota3) })
    });
    const data = await res.json();
    if (data.ok) {
      mostrarMsg('✅ Estudiante actualizado correctamente.', 'success');
      document.getElementById('editNombreHeader').textContent = nombre;
      buscar();
    } else {
      mostrarMsg('❌ ' + data.error, 'error');
    }
  }

  function confirmarEliminar() {
    document.getElementById('modalNombre').textContent = estudianteSeleccionado?.nombre || '';
    document.getElementById('modalBackdrop').classList.add('visible');
  }

  function cerrarModal() {
    document.getElementById('modalBackdrop').classList.remove('visible');
  }

  async function eliminarEstudiante() {
    cerrarModal();
    const id = document.getElementById('editId').value;
    const res  = await fetch('/api/estudiantes/eliminar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) {
      mostrarMsg('✅ Estudiante eliminado correctamente.', 'success');
      cancelarEdicion();
      buscar();
    } else {
      mostrarMsg('❌ ' + data.error, 'error');
    }
  }

  function mostrarMsg(texto, tipo) {
    const el = document.getElementById('editMsg');
    el.textContent = texto; el.className = `msg ${tipo}`;
  }

  cargarTodos();
</script>
<!-- ── ROCK EASTER EGG ── -->
<div id="rockOverlay">
  <img id="rockImg" src="/static/rock.jpg" alt="The Rock">
</div>
<audio id="vineAudio" src="/static/Vine boom sound effect.mp3" preload="auto"></audio>

<script>
  (function() {
    var rockTimer = null;

    document.addEventListener('keydown', function(e) {
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
      if (e.key === 'r' || e.key === 'R') showRock();
    });

    function showRock() {
      var overlay = document.getElementById('rockOverlay');
      var audio   = document.getElementById('vineAudio');

      // Cancelar timer anterior y resetear clase para forzar reflow
      clearTimeout(rockTimer);
      overlay.classList.remove('show');
      void overlay.offsetWidth; // reflow — arranca transición desde 0

      overlay.classList.add('show');
      audio.currentTime = 0;
      audio.play().catch(function(){});

      rockTimer = setTimeout(function() {
        overlay.classList.remove('show'); // fade out automático
      }, 3000);
    }
  })();
</script>
</body>
</html>
